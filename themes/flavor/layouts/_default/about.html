{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="about-content">
      <div class="about-image">
        <img src="/images/tracey-portrait.jpg" alt="Tracey Ahrendt" onerror="this.parentElement.style.background='var(--color-border)'">
      </div>
      <div class="about-text">
        {{ .Content }}
      </div>
    </div>
  </div>
</section>
{{ end }}
